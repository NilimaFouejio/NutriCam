openapi: 3.0.3
info:
  title: NutriCam API
  version: 1.1.0
  description: |
    Contrat entre l'application mobile NutriCam (.NET MAUI) et le backend.
    Il est dérivé du schéma SQL NutriCam (14 tables). Hors périmètre, volontairement :
    interface administrateur (aucune route d'écriture sur aliments, recettes, activités),
    poids cible (poids_cible_kg), durées (duree_jours, duree_min, duree_recommandee_min) et ville.

    Conventions
    - Base : /api/v1. JSON UTF-8. Champs en snake_case, identiques aux colonnes SQL quand elles existent.
    - Authentification : en-tête `Authorization: Bearer <jeton>` sur toutes les routes sauf /auth/*.
    - Identifiants : UUID au format texte de 36 caractères (colonnes VARCHAR(36)). Ils sont générés par le serveur : la base n'a pas de valeur par défaut.
    - Dates : `YYYY-MM-DD`. Horodatages : ISO 8601 UTC.
    - Erreurs : toujours un objet `Erreur` ; `code` est stable et sert au client, `message` est affichable.
    - Idempotence : POST /profils/moi/programmes exige l'en-tête `Idempotency-Key`. Même clé = même réponse, sans doublon.
    - Un utilisateur n'accède qu'à ses propres données (le profil est toujours « moi », déduit du jeton).
    - Les conditions de santé (maladies) restent sur l'appareil : elles ne sont jamais envoyées.
servers:
  - url: http://localhost:4010/api/v1
    description: Serveur mock (Prism) ou API locale
tags:
  - name: Auth
  - name: Profil
  - name: Catalogue
  - name: Programme
  - name: Activite
security:
  - bearerAuth: []
paths:
  /auth/inscription:
    post:
      tags: [Auth]
      security: []
      summary: Créer un compte (table utilisateurs)
      operationId: inscrire
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InscriptionRequest' }
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/connexion:
    post:
      tags: [Auth]
      security: []
      summary: Se connecter
      operationId: connecter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnexionRequest' }
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
  /utilisateurs/moi:
    delete:
      tags: [Auth]
      summary: Supprimer mon compte et toutes mes données (cascade SQL)
      operationId: supprimerCompte
      responses:
        '204': { description: Supprimé }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
  /profils/moi:
    get:
      tags: [Profil]
      summary: Récupérer mon profil complet (restauration sur un nouvel appareil)
      operationId: getProfil
      responses:
        '200':
          description: Profil trouvé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilComplet' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404':
          description: Aucun profil créé pour ce compte (code PROFIL_ABSENT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }
    put:
      tags: [Profil]
      summary: Créer ou remplacer mon profil, mon objectif et mes critères (idempotent)
      description: |
        Écrit en une transaction : profils, objectifs, criteres_alimentaires, preferences_alimentaires
        (prefere / disponible) et aliments_a_eviter. Les listes envoyées REMPLACENT les anciennes.
        Un aliment est résolu par `id_aliment` ; à défaut par `nom_aliment` (insensible à la casse et aux accents).
        Un nom introuvable n'est pas une erreur : il est listé dans `avertissements`.
      operationId: sauvegarderProfil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilComplet' }
      responses:
        '200':
          description: Profil enregistré (avec les identifiants générés)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilComplet' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '422': { $ref: '#/components/responses/Validation' }
  /aliments:
    get:
      tags: [Catalogue]
      summary: Catalogue des aliments (lecture seule)
      description: Supporte `ETag` / `If-None-Match` (réponse 304 si inchangé).
      operationId: getAliments
      parameters:
        - in: header
          name: If-None-Match
          schema: { type: string }
      responses:
        '200':
          description: Liste des aliments
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Aliment' }
        '304': { description: Catalogue inchangé }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
  /profils/moi/programmes:
    post:
      tags: [Programme]
      summary: Générer un programme alimentaire personnalisé de 7 jours
      description: |
        Compose dynamiquement un programme de sept jours à partir du profil
        de l'utilisateur authentifié, de son objectif, de ses caractéristiques
        physiques, de ses critères alimentaires, des aliments disponibles,
        des recettes et des règles métier documentées et validées.

        Le profil est récupéré côté serveur à partir du jeton d'authentification.
        Le client ne peut pas fournir un profil de substitution dans cette requête.

        Le backend utilise les aliments, recettes, ingrédients, quantités,
        valeurs nutritionnelles et règles provenant des données de référence.
        Il distingue les règles explicites, les données sources, les calculs
        déduits et les hypothèses. Une hypothèse ne devient jamais une règle
        officielle sans validation métier.

        Le backend vérifie la complétude du profil, les unités, les quantités,
        les densités énergétiques, les apports par ingrédient, les totaux par
        repas et par journée, ainsi que les écarts aux cibles énergétiques.
        Les valeurs absentes ne sont pas inventées et les anomalies ne sont
        pas corrigées silencieusement.

        La répartition de référence documentée est : petit-déjeuner 25 %,
        déjeuner 55 %, dîner 20 %. Elle ne s'applique que dans le cadre prévu
        par les documents métier validés. La somme des pourcentages et les
        règles d'arrondi sont contrôlées.

        Les profils de démonstration des documents ne sont pas des règles
        universelles. Une cible énergétique directement fournie par une
        source est conservée. Elle n'est pas recalculée à partir des données
        personnelles en l'absence d'une formule explicitement validée.

        Les contraintes de composition confirmées par les documents sont
        appliquées comme règles explicites : petit-déjeuner adapté au profil,
        déjeuner avec accompagnement lorsque prévu, dîner sans féculent
        d'accompagnement dans le programme de référence, et exclusion des
        jus et smoothies au déjeuner et au dîner lorsque cette règle s'applique.
        Aucune recette manquante n'est inventée.

        Les allergies entraînent une exclusion stricte, y compris pour les
        ingrédients indirects des recettes. Les préférences, aliments
        disponibles et budget sont pris en compte sans passer outre une
        restriction stricte.

        Le programme est enregistré uniquement après réussite des contrôles
        obligatoires. Les ingrédients réellement utilisés, quantités calculées,
        résultats de validation et versions des données/règles sont conservés
        afin de permettre la traçabilité. La génération est déclenchée
        uniquement par cet appel explicite ; consulter ou modifier le profil
        ne déclenche jamais une génération.

        Une même clé Idempotency-Key et un même contenu renvoient le résultat
        initial sans créer de doublon. La réutilisation de la clé avec un
        contenu différent est refusée.
      operationId: creerProgramme
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: UUID unique pour cette opération de génération.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreerProgrammeRequest' }
            example:
              date_debut: "2026-11-01"
              regenerer: false
      responses:
        '201':
          description: Programme personnalisé généré et enregistré après validation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Programme' }
        '200':
          description: "Requête déjà traitée avec la même clé et le même contenu ; programme initial renvoyé"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Programme' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '409':
          description: |
            Profil incomplet (PROFIL_INCOMPLET) ou clé d'idempotence réutilisée
            avec un contenu différent (CLE_IDEMPOTENCE_REUTILISEE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }
        '422':
          description: |
            Génération impossible : aucune combinaison compatible, données
            nutritionnelles indispensables manquantes ou échec d'un contrôle
            métier obligatoire.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }
        '500':
          description: Erreur technique pendant la génération
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erreur' }
  /programmes/{id_programme}/semaine:
    get:
      tags: [Programme]
      summary: Les 7 jours du programme, sans le régénérer
      operationId: getSemaine
      parameters:
        - { $ref: '#/components/parameters/IdProgramme' }
      responses:
        '200':
          description: Programme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Programme' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /programmes/{id_programme}/repas/{id_repas_programme}:
    patch:
      tags: [Programme]
      summary: Marquer un repas comme mangé (ou annuler)
      operationId: majRepas
      parameters:
        - { $ref: '#/components/parameters/IdProgramme' }
        - in: path
          name: id_repas_programme
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MajRepasRequest' }
      responses:
        '204': { description: Mis à jour }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /recettes/{id_recette}/alternatives:
    get:
      tags: [Programme]
      summary: Recettes alternatives compatibles (table alternatives_repas)
      description: Les alternatives passent par le même filtre « aliments à éviter » que les repas principaux.
      operationId: getAlternatives
      parameters:
        - in: path
          name: id_recette
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Alternatives (liste vide possible)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Recette' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }
  /activites:
    get:
      tags: [Activite]
      summary: Catalogue des activités physiques (lecture seule)
      operationId: getActivites
      responses:
        '200':
          description: Activités
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Activite' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
  /profils/moi/recommandations-activite:
    get:
      tags: [Activite]
      summary: Recommandations d'activité indicatives pour mon profil
      description: Recommandation non médicale, adaptée à l'objectif et au niveau d'activité.
      operationId: getRecommandationsActivite
      responses:
        '200':
          description: Recommandations (liste vide possible)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecommandationActivite' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdProgramme:
      in: path
      name: id_programme
      required: true
      schema: { type: string, format: uuid }
  responses:
    NonAuthentifie:
      description: Jeton absent, invalide ou expiré (codes NON_AUTHENTIFIE, IDENTIFIANTS_INVALIDES)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
    Conflit:
      description: Ressource déjà existante (code EMAIL_DEJA_UTILISE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
    Validation:
      description: Données invalides (code VALIDATION, `details` liste les champs)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
    Introuvable:
      description: Ressource inexistante ou appartenant à un autre utilisateur (code INTROUVABLE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erreur' }
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Code stable lu par le client.
          enum: [NON_AUTHENTIFIE, IDENTIFIANTS_INVALIDES, EMAIL_DEJA_UTILISE, VALIDATION, INTROUVABLE, PROFIL_ABSENT, PROFIL_INCOMPLET, AUCUN_PROGRAMME_COMPATIBLE, DONNEES_NUTRITIONNELLES_INCOMPLETES, ECHEC_VALIDATION_PROGRAMME, CLE_IDEMPOTENCE_REUTILISEE, ERREUR_SERVEUR]
        message: { type: string, example: "Aucun programme ne correspond à vos critères. Ajustez-les et réessayez." }
        details:
          type: array
          items:
            type: object
            properties:
              champ: { type: string }
              message: { type: string }
    InscriptionRequest:
      type: object
      required: [nom, email, mot_de_passe]
      properties:
        nom: { type: string, maxLength: 100, example: Aïcha }
        email: { type: string, format: email, maxLength: 255 }
        mot_de_passe: { type: string, minLength: 8, description: "Envoyé en HTTPS uniquement ; le serveur stocke mot_de_passe_hash." }
    ConnexionRequest:
      type: object
      required: [email, mot_de_passe]
      properties:
        email: { type: string, format: email }
        mot_de_passe: { type: string }
    Utilisateur:
      type: object
      required: [id_utilisateur, nom, email]
      properties:
        id_utilisateur: { type: string, format: uuid }
        nom: { type: string }
        email: { type: string, format: email }
    Session:
      type: object
      required: [jeton, utilisateur]
      properties:
        jeton: { type: string }
        expire_le: { type: string, format: date-time }
        utilisateur: { $ref: '#/components/schemas/Utilisateur' }
    Profil:
      type: object
      required: [age, taille_cm, poids_actuel_kg]
      properties:
        id_profil: { type: string, format: uuid, readOnly: true }
        age: { type: integer, minimum: 1 }
        taille_cm: { type: number, minimum: 1, example: 168 }
        poids_actuel_kg: { type: number, minimum: 1, example: 72.5 }
        niveau_activite:
          type: string
          enum: [tres_sedentaire, legerement_actif, moderement_actif, tres_actif]
          description: |
            Profil d'activité du tableau « 5.2 Estimer la dépense énergétique totale » :
            tres_sedentaire (facteur 1,2), legerement_actif (1,3–1,4), moderement_actif (1,5–1,6), tres_actif (1,7–1,9).
            Le serveur retient le milieu de chaque fourchette (1,2 ; 1,35 ; 1,55 ; 1,8). Obligatoire pour générer un programme.
        sexe:
          type: string
          enum: [femme, homme]
          description: AJOUT au schéma SQL (profils.sexe). Sert au besoin énergétique.
        repas_par_jour:
          type: integer
          minimum: 3
          maximum: 3
          description: Fixé à 3 (petit-déjeuner, déjeuner, dîner). Facultatif dans la requête, toujours 3 dans la réponse.
    Objectif:
      type: object
      description: Table objectifs (id_objectif, id_profil, type_objectif). Le serveur garde un seul objectif courant par profil et le met à jour en place.
      required: [type_objectif]
      properties:
        id_objectif: { type: string, format: uuid, readOnly: true }
        type_objectif: { type: string, enum: [perte_de_poids, maintien, prise_de_poids] }
    AlimentRef:
      type: object
      description: Référence à un aliment. Au moins un des deux champs.
      properties:
        id_aliment: { type: string, format: uuid }
        nom_aliment: { type: string, example: Plantain }
    Evitement:
      type: object
      description: Aliment à éviter (table aliments_a_eviter).
      properties:
        id_aliment: { type: string, format: uuid }
        nom_aliment: { type: string, example: Arachides }
        motif:
          type: string
          enum: [preference, allergie, intolerance, autre]
          description: AJOUT au schéma SQL (aliments_a_eviter.motif). `allergie` = exclusion stricte.
    Criteres:
      type: object
      required: [budget]
      properties:
        budget: { type: string, enum: [economique, moyen, confort] }
        aliments_preferes:
          type: array
          items: { $ref: '#/components/schemas/AlimentRef' }
        aliments_disponibles:
          type: array
          items: { $ref: '#/components/schemas/AlimentRef' }
        aliments_a_eviter:
          type: array
          items: { $ref: '#/components/schemas/Evitement' }
    ProfilComplet:
      type: object
      required: [profil, objectif, criteres]
      properties:
        profil: { $ref: '#/components/schemas/Profil' }
        objectif: { $ref: '#/components/schemas/Objectif' }
        criteres: { $ref: '#/components/schemas/Criteres' }
        id_programme_courant:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        avertissements:
          type: array
          readOnly: true
          items: { type: string }
          example: ["Aliment non reconnu : « Piment »"]
    Aliment:
      type: object
      required: [id_aliment, nom_aliment]
      properties:
        id_aliment: { type: string, format: uuid }
        nom_aliment: { type: string }
        categorie:
          type: string
          enum: [legume, proteine, feculent, autre]
          description: Convention du contrat pour la colonne libre aliments.categorie.
        energie_kcal_100g: { type: number }
        proteines_100g: { type: number }
        glucides_100g: { type: number }
        lipides_100g: { type: number }
    Ingredient:
      type: object
      required: [id_aliment, nom_aliment, quantite, unite, apport_energetique_kcal]
      properties:
        id_aliment: { type: string, format: uuid }
        nom_aliment: { type: string }
        categorie: { type: string, enum: [legume, proteine, feculent, autre] }
        quantite: { type: number }
        unite: { type: string, example: g }
        apport_energetique_kcal: { type: number }
    Recette:
      type: object
      required: [id_recette, nom_recette, valeur_energetique_totale_kcal, ingredients]
      properties:
        id_recette: { type: string, format: uuid }
        nom_recette: { type: string }
        description: { type: string, nullable: true, description: "AJOUT au schéma SQL (recettes.description)." }
        preparation: { type: string, nullable: true, description: "AJOUT au schéma SQL (recettes.preparation)." }
        valeur_energetique_totale_kcal: { type: number, description: Pour UNE portion. }
        ingredients:
          type: array
          items: { $ref: '#/components/schemas/Ingredient' }
    RepasProgramme:
      type: object
      required: [id_repas_programme, numero_jour, type_repas, nombre_portions, recette, apport_energetique_total_kcal]
      properties:
        id_repas_programme: { type: string, format: uuid }
        numero_jour: { type: integer, minimum: 1, maximum: 7 }
        type_repas: { type: string, enum: [petit_dejeuner, dejeuner, diner, collation] }
        nombre_portions: { type: number, exclusiveMinimum: 0 }
        est_realise: { type: boolean, default: false, description: "AJOUT au schéma SQL (repas_programme.est_realise)." }
        recette: { $ref: '#/components/schemas/Recette' }
        cible_energetique_kcal:
          type: number
          nullable: true
          description: Cible énergétique du repas, uniquement si elle est définie par une règle métier applicable.
        apport_energetique_total_kcal:
          type: number
          minimum: 0
          description: Apport total des portions effectivement prévues, calculé à partir des ingrédients utilisés.
        ecart_energetique_kcal:
          type: number
          nullable: true
          description: Écart entre l'apport calculé et la cible du repas, si une cible existe.
        ingredients_utilises:
          type: array
          description: Quantités réellement utilisées après adaptation éventuelle de la recette.
          items:
            type: object
            required: [id_aliment, nom_aliment, quantite, unite, apport_energetique_kcal]
            properties:
              id_aliment: { type: string, format: uuid }
              nom_aliment: { type: string }
              quantite: { type: number, minimum: 0.000001 }
              unite: { type: string, example: g }
              apport_energetique_kcal: { type: number, minimum: 0 }
    Programme:
      type: object
      required: [id_programme, date_debut, repas, synthese_energetique, validation]
      properties:
        id_programme: { type: string, format: uuid }
        id_objectif: { type: string, format: uuid }
        date_creation: { type: string, format: date-time }
        date_debut: { type: string, format: date }
        repas:
          type: array
          minItems: 21
          description: Repas des sept jours, au minimum trois repas par jour, triés par jour et ordre de la journée.
          items: { $ref: '#/components/schemas/RepasProgramme' }
        synthese_energetique: { $ref: '#/components/schemas/SyntheseEnergetique' }
        validation: { $ref: '#/components/schemas/ValidationProgramme' }
        version_regles:
          type: string
          description: Identifiant de version des règles métier appliquées.
        version_donnees_nutritionnelles:
          type: string
          description: Version ou identifiant du jeu de données nutritionnelles utilisé.
        avertissements:
          type: array
          items: { type: string }
          description: Avertissements non bloquants ; une allergie incompatible n'est jamais un simple avertissement.
    SyntheseEnergetique:
      type: object
      required: [methode_calcul, repartition_repas, totaux_journaliers]
      properties:
        cible_energetique_journaliere_kcal:
          type: number
          nullable: true
          description: Cible documentée et applicable ; null si aucune cible fiable n'est définie.
        methode_calcul:
          type: string
          description: Identifiant de la méthode documentée et validée ; ne pas inventer de formule.
        repartition_repas:
          type: array
          items:
            type: object
            required: [type_repas, pourcentage]
            properties:
              type_repas: { type: string, enum: [petit_dejeuner, dejeuner, diner] }
              pourcentage: { type: number, minimum: 0, maximum: 100 }
              cible_energetique_kcal: { type: number, nullable: true }
        totaux_journaliers:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [numero_jour, apport_energetique_kcal]
            properties:
              numero_jour: { type: integer, minimum: 1, maximum: 7 }
              apport_energetique_kcal: { type: number, minimum: 0 }
              cible_energetique_kcal: { type: number, nullable: true }
              ecart_energetique_kcal: { type: number, nullable: true }
    ValidationProgramme:
      type: object
      required: [statut, controles]
      properties:
        statut:
          type: string
          enum: [valide, valide_avec_avertissements]
        controles:
          type: array
          items:
            type: object
            required: [code, statut]
            properties:
              code: { type: string, description: Identifiant stable du contrôle métier. }
              statut: { type: string, enum: [reussi, avertissement] }
              message: { type: string }
              ecart_kcal: { type: number, nullable: true }
    CreerProgrammeRequest:
      type: object
      required: [date_debut]
      additionalProperties: false
      properties:
        date_debut:
          type: string
          format: date
          description: Premier jour du programme personnalisé.
        regenerer:
          type: boolean
          default: false
          description: Demande explicitement un nouveau programme calculé à partir du profil actuel et des règles applicables.
    MajRepasRequest:
      type: object
      properties:
        est_realise: { type: boolean }
    Activite:
      type: object
      required: [id_activite, nom_activite]
      properties:
        id_activite: { type: string, format: uuid }
        nom_activite: { type: string }
        description: { type: string, nullable: true }
        niveau: { type: string, nullable: true }
        objectif_associe: { type: string, nullable: true, enum: [perte_de_poids, maintien, prise_de_poids] }
    RecommandationActivite:
      type: object
      required: [id_recommandation, activite]
      properties:
        id_recommandation: { type: string, format: uuid }
        activite: { $ref: '#/components/schemas/Activite' }
        frequence_hebdomadaire: { type: integer, minimum: 1, nullable: true }
